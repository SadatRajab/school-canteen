<div class="products-container">
    <div class="actions-bar">
        <h2>{{ t.products }}</h2>
        <button mat-raised-button color="primary" (click)="openCreateDialog()">
            <mat-icon>add</mat-icon>
            {{ t.addProduct }}
        </button>
    </div>

    <mat-spinner *ngIf="loading" class="loading-spinner"></mat-spinner>

    <table mat-table [dataSource]="products" class="products-table" *ngIf="!loading">
        <ng-container matColumnDef="image">
            <th mat-header-cell *matHeaderCellDef>{{ t.image }}</th>
            <td mat-cell *matCellDef="let product">
                <img [src]="getImageUrl(product)" [alt]="getProductName(product)" class="product-image" />
            </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>{{ t.name }}</th>
            <td mat-cell *matCellDef="let product">
                <div class="product-name">
                    <div>{{ product.nameAr }}</div>
                    <div class="name-en">{{ product.nameEn }}</div>
                </div>
            </td>
        </ng-container>

        <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef>{{ t.price }}</th>
            <td mat-cell *matCellDef="let product">
                {{ product.price }} {{ t.currency }}
            </td>
        </ng-container>

        <ng-container matColumnDef="available">
            <th mat-header-cell *matHeaderCellDef>{{ t.available }}</th>
            <td mat-cell *matCellDef="let product">
                <mat-chip [color]="product.isAvailable ? 'primary' : 'warn'" selected>
                    {{ product.isAvailable ? t.yes : t.no }}
                </mat-chip>
            </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>{{ t.actions }}</th>
            <td mat-cell *matCellDef="let product">
                <button mat-icon-button color="primary" (click)="openEditDialog(product)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn" (click)="deleteProduct(product)">
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
</div>
