# Netlify Configuration for School Canteen Frontend-Only Demo

[build]
  # Build command
  command = "npm run build"
  
  # Publish directory (Angular output folder)
  publish = "dist/school-canteen/browser"
  
  # Base directory (where package.json is located)
  base = "FrontEnd"

# Redirect all URLs to index.html for Angular routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Cache control
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Cache static assets for 1 year
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (can be overridden in Netlify UI)
# [build.environment]
#   NODE_VERSION = "18"

# Functions (not used in this frontend-only app, but available if needed)
# [functions]
#   directory = "functions"
